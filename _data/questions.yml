# =============================================================
#  Question bank
#  Use in any page with:   {% include question.html id="<key>" %}
#
#  Fields
#    type:          text | choice | open   (inferred if omitted)
#    question:      the prompt (Markdown allowed)
#    answers:       [text] list of accepted answers. Case, extra spaces,
#                   a leading "$ " and a trailing period are ignored.
#    options:       [choice] list of options (Markdown allowed)
#    answer:        [choice] number of the correct option, starting at 1
#    hint:          shown after two wrong attempts
#    explanation:   shown once answered or revealed (Markdown allowed)
#    sample_answer: [open] model answer shown on request
#    placeholder:   [text] placeholder text in the answer box
# =============================================================

# ---- Getting Started --------------------------------------------
setup-shell-name:
  type: text
  question: "Run `echo $SHELL`. What is the **last part** of the path it prints (the name of your shell)?"
  answers: ["bash", "zsh", "/bin/bash", "/bin/zsh", "/usr/bin/bash", "/usr/bin/zsh"]
  hint: "Look at the text after the final `/`."
  explanation: "Most Linux and WSL systems use **bash**; recent macOS versions default to **zsh**. Everything in this course works in either."

course-structure:
  type: choice
  question: "How is each section of this course organized?"
  options:
    - Lectures only, followed by a final exam
    - A lecture that introduces ideas, then hands-on activities that apply them
    - Activities first, then a lecture that explains what happened
  answer: 2
  explanation: "Each section opens with a short lecture and continues with one or more activities. The **Next** link at the bottom of every page walks you through them in order."

# ---- The Command Line ---------------------------------------------
shell-what-is-prompt:
  type: choice
  question: "In the line `user@laptop:~/course$ ls -l data`, which part is the **argument**?"
  options:
    - "`user@laptop:~/course$`"
    - "`ls`"
    - "`-l`"
    - "`data`"
  answer: 4
  explanation: "`user@laptop:~/course$` is the prompt, `ls` is the command, `-l` is an option (flag) that changes how it behaves, and `data` is the argument it acts on."

nav-pwd:
  type: text
  question: "Which command prints the full path of the directory you are currently in?"
  answers: ["pwd"]
  hint: "Three letters: **p**rint **w**orking **d**irectory."
  explanation: "`pwd` prints the absolute path of your current working directory."

nav-parent:
  type: text
  question: "Which command moves you **up one level** to the parent directory?"
  answers: ["cd ..", "cd ../"]
  hint: "Two dots always mean *the directory above this one*."
  explanation: "`..` is a shortcut for the parent directory, so `cd ..` moves up one level. A single `.` means the current directory."

nav-absolute-relative:
  type: choice
  question: "Which of these is an **absolute** path?"
  options:
    - "`data/raw`"
    - "`../results`"
    - "`/home/student/course/data`"
    - "`./notes.txt`"
  answer: 3
  explanation: "Absolute paths start at the root of the file system, so they always begin with `/`. The others are relative to wherever you are now."

pipes-count-lines:
  type: text
  question: "Which command counts the number of **lines** in `samplesheet.csv`?"
  answers: ["wc -l samplesheet.csv", "cat samplesheet.csv | wc -l", "wc -l < samplesheet.csv"]
  hint: "Use `wc` (word count) with the option for lines."
  placeholder: "e.g. command filename"
  explanation: "`wc -l` counts lines. The file has **4** lines: one header plus three samples."

pipes-redirect:
  type: choice
  question: "What is the difference between `>` and `>>`?"
  options:
    - "`>` appends to a file; `>>` overwrites it"
    - "`>` overwrites a file; `>>` appends to the end of it"
    - "They are identical"
  answer: 2
  explanation: "`>` replaces the file's contents (creating it if needed). `>>` adds to the end, which is safer when you are building up a log or results file."

pipes-reflect:
  type: open
  question: "In your own words, why is it useful to chain small commands together with `|` rather than having one big program for every task?"
  sample_answer: "Each small tool does one job well, so you can combine them in new ways without writing new software. Pipes also pass data straight from one step to the next, so you don't need to create intermediate files."

# ---- Working with Sequence Data -------------------------------------
fastq-lines-per-record:
  type: choice
  question: "How many lines make up a single record (one read) in a standard FASTQ file?"
  options: ["1", "2", "4", "It varies by read length"]
  answer: 3
  explanation: "Each record has four lines: a header starting with `@`, the sequence, a `+` separator, and a quality string the same length as the sequence."

fastq-count-reads:
  type: text
  question: "Using the line count from the previous step, how many **reads** are in `sample01.fastq`?"
  answers: ["8", "eight"]
  hint: "Divide the number of lines by the number of lines per record."
  explanation: "32 lines ÷ 4 lines per record = **8 reads**."

fastq-grep-trap:
  type: open
  question: "`grep -c '^@' sample01.fastq` reports **10**, but the file has 8 reads. Why might counting lines that start with `@` give the wrong answer?"
  sample_answer: "`@` is also a valid quality character (it encodes a Phred score of 31), so some quality lines happen to start with `@` and get counted too. Counting lines and dividing by four — or matching the full header pattern, such as `^@sample01_` — is more reliable."

fastq-read-length:
  type: text
  question: "How long (in bases) is each read in this file?"
  answers: ["50", "50 bp", "50bp", "50 bases"]
  hint: "Print just one sequence line and pipe it to `wc -c`, then subtract 1 for the newline character."
  explanation: "Each read is **50 bases** long. `wc -c` counts the newline at the end of the line too, which is why it reports 51."

fastq-quality-meaning:
  type: choice
  question: "In Phred+33 encoding, a quality character with a **higher** ASCII value means…"
  options:
    - "the base call is less likely to be correct"
    - "the base call is more likely to be correct"
    - "the base is a G or C"
  answer: 2
  explanation: "The Phred score is the ASCII value minus 33. A score of 30 means a 1-in-1,000 chance the call is wrong; 40 means 1 in 10,000."

# ---- Taxonomic Classification and Genomic Subtyping ------------------

ecoli-shigella-ipah:
  type: choice
  question: "A genome is positive for *ipaH*. What can you conclude?"
  options:
    - "It is definitely *Shigella*"
    - "It is *Shigella* or enteroinvasive *E. coli* (EIEC), but not another kind of *E. coli*"
    - "It is not *Shigella*"
  answer: 2
  explanation: "*ipaH* is carried by both *Shigella* and EIEC. It rules out other *E. coli* but cannot separate *Shigella* from EIEC on its own, which is why ShigaPass also checks the serotype-defining *rfb* genes and other markers."

flu-genome-ani:
  type: choice
  question: "Would these two viruses count as the same species under the ~95% ANI rule used for bacteria?"
  options:
    - "Yes — they share more than 95% ANI"
    - "No — they are far below 95%, even though both are influenza A"
  answer: 2
  explanation: "The two genomes are far below 95% identity, and part of each genome is too different for FastANI to match at all. Yet both viruses belong to the same species, influenza A. Viral species are not defined by a fixed identity threshold."

flu-label-subtype:
  type: open
  question: "What subtype is each virus, according to LABEL? Which two segments determine the subtype?"
  sample_answer: "Virus 1 is H1N1 (`A_HA_H1` and `A_NA_N1`) and virus 2 is H3N2 (`A_HA_H3` and `A_NA_N2`). The subtype comes from the HA and NA segments; the other six are labeled only by segment (such as `A_PB2`)."

flu-segment-most-different:
  type: choice
  question: "Which segments differ most between the two viruses?"
  options:
    - "The polymerase segments (PB2, PB1, PA)"
    - "HA and NA"
    - "MP and NS"
    - "All segments differ about equally"
  answer: 2
  explanation: "HA and NA are so different between subtypes that FastANI cannot measure them (below ~80%). The internal segments are much more similar."

flu-why-ha-na:
  type: open
  question: "Why are HA and NA so much more different than the other segments, and what does this mean for how we classify influenza?"
  sample_answer: "HA and NA encode the surface proteins targeted by the immune system, so they change quickly, and the different subtypes have diverged a long way from one another. Because segments can also be swapped by reassortment, each segment has its own history. Since a single species contains such different viruses, influenza is described by subtype (from HA and NA), clade, and genotype rather than by species alone."

ecoli-shigella-fastani:
  type: choice
  question: "Based on the ~95% ANI rule for bacteria, are the two isolates the same species?"
  options:
    - "Yes — they share more than 95% ANI"
    - "No — they share less than 95% ANI"
  answer: 1
  explanation: "The isolates share well over 95% ANI, so by the usual genomic definition they look like the same species. Keep that in mind for the next step."

ecoli-shigella-gambit:
  type: choice
  question: "What does GAMBIT identify **isolate A** as?"
  options:
    - "*Shigella flexneri*"
    - "*Escherichia coli*"
    - "*Salmonella enterica*"
  answer: 2
  explanation: "GAMBIT identifies isolate A as *E. coli*, even though it was reported as *S. flexneri* and shares more than 95% ANI with a *S. flexneri* isolate."

ecoli-shigella-which:
  type: choice
  question: "Based on ShigaPass, which isolate is *Shigella*?"
  options:
    - "Isolate A"
    - "Isolate B"
    - "Both"
    - "Neither"
  answer: 2
  explanation: "Only isolate B carries *ipaH* and *Shigella* serotype genes. Isolate A lacks them, confirming GAMBIT's call: it is *E. coli*."

ecoli-shigella-why:
  type: open
  question: "In your own words, why did FastANI suggest the two isolates were the same species, when one is *E. coli* and the other is *Shigella*?"
  sample_answer: "Across the whole genome, *E. coli* and *Shigella* are so similar that they fall within one species boundary — *Shigella* lineages sit inside the *E. coli* family tree. The *Shigella* name depends on a few specific genes, such as *ipaH* and the serotype-defining genes, which a genome-wide identity score does not single out. A curated classifier like GAMBIT, and a targeted tool like ShigaPass, are needed to tell them apart."

ecoli-st-compare:
  type: choice
  question: "If you only compared isolates that share an ST, which isolate would you leave out?"
  options:
    - "GCA_032856485.1"
    - "GCA_040936765.1"
    - "GCA_058079015.1"
    - "None — they all share an ST"
  answer: 2
  explanation: "GCA_040936765.1 has a different ST from the other two, so an ST-based grouping would set it aside — even though it is only 12 and 18 SNPs from them across the whole genome."

ecoli-st-alleles:
  type: open
  question: "How many of the seven alleles differ between GCA_040936765.1 and the other two isolates? How can isolates that are only 12–18 SNPs apart have different STs?"
  sample_answer: "Only a small number of alleles differ — possibly just one. Each allele number stands for an exact gene sequence, so a single SNP in one of the seven MLST genes creates a new allele and therefore a new ST. ST numbers are labels for allele combinations, not measures of genome-wide distance."

ecoli-floc-together:
  type: choice
  question: "Where did Floc place GCA_040936765.1?"
  options:
    - "In a cluster of its own"
    - "In the same cluster as the other two isolates"
    - "Nowhere — Floc could not cluster it"
  answer: 2
  explanation: "Floc grouped all three isolates together. It compares genomes directly across the whole genome, so isolates this closely related cluster together regardless of their ST."

ecoli-floc-name:
  type: choice
  question: "If another laboratory clustered these same three isolates in its own Floc database, would it give them the same cluster number?"
  options:
    - "Yes — cluster numbers are fixed, like STs"
    - "Not necessarily — numbers depend on each database's history"
    - "Only if the isolates share an ST"
  answer: 2
  explanation: "Floc numbers clusters in the order it finds them within one database. Another laboratory — or a rebuilt database, or a different distance threshold — can find the same group of genomes and give it a different number. That is what makes cluster names harder to communicate than STs."
