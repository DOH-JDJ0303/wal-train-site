# ---- Taxonomic Classification and Genomic Subtyping ------------------

ecoli-shigella-ipah:
  type: choice
  question: "A genome is positive for *ipaH*. What can you conclude?"
  options:
    - "It is definitely *Shigella*"
    - "It is *Shigella* or enteroinvasive *E. coli* (EIEC), but not another kind of *E. coli*"
    - "It is not *Shigella*"
  answer: 2
  explanation: "*ipaH* is carried by both *Shigella* and EIEC. It rules out other *E. coli* but cannot separate *Shigella* from EIEC on its own, which is why ShigaPass also checks the serotype-defining *rfb* genes and other markers."

flu-genome-ani:
  type: choice
  question: "Would these two viruses count as the same species under the ~95% ANI rule used for bacteria?"
  options:
    - "Yes, they share more than 95% ANI"
    - "No, they are far below 95%, even though both are influenza A"
  answer: 2
  explanation: "The two genomes are far below 95% identity, and part of each genome is too different for FastANI to match at all. Yet both viruses belong to the same species, influenza A. Viral species are not defined by a fixed identity threshold."

flu-label-subtype:
  type: open
  question: "What subtype is each virus, according to LABEL? Which two segments determine the subtype?"
  sample_answer: "Virus 1 is H1N1 (`A_HA_H1` and `A_NA_N1`) and virus 2 is H3N2 (`A_HA_H3` and `A_NA_N2`). The subtype comes from the HA and NA segments; the other six are labeled only by segment (such as `A_PB2`)."

ecoli-shigella-fastani:
  type: choice
  question: "Based on the ~95% ANI rule for bacteria, are the two isolates the same species?"
  options:
    - "Yes, they share more than 95% ANI"
    - "No, they share less than 95% ANI"
  answer: 1
  explanation: "The isolates share well over 95% ANI, so by the usual genomic definition they look like the same species. Keep that in mind for the next step."

ecoli-shigella-gambit:
  type: choice
  question: "What does GAMBIT identify **isolate A** as?"
  options:
    - "*Shigella flexneri*"
    - "*Escherichia coli*"
    - "*Salmonella enterica*"
  answer: 2
  explanation: "GAMBIT identifies isolate A as *E. coli*, even though it was reported as *S. flexneri* and shares more than 95% ANI with a *S. flexneri* isolate."

ecoli-shigella-which:
  type: choice
  question: "Based on ShigaPass, which isolate is *Shigella*?"
  options:
    - "Isolate A"
    - "Isolate B"
    - "Both"
    - "Neither"
  answer: 2
  explanation: "Only isolate B carries *ipaH* and *Shigella* serotype genes. Isolate A lacks them, confirming GAMBIT's call: it is *E. coli*."

ecoli-shigella-why:
  type: open
  question: "In your own words, why did FastANI suggest the two isolates were the same species, when one is *E. coli* and the other is *Shigella*?"
  sample_answer: "Across the whole genome, *E. coli* and *Shigella* are so similar that they fall within one species boundary, and *Shigella* lineages sit inside the *E. coli* family tree. The *Shigella* name depends on a few specific genes, such as *ipaH* and the serotype-defining genes, which a genome-wide identity score does not single out. A curated classifier like GAMBIT, and a targeted tool like ShigaPass, are needed to tell them apart."

ecoli-st-compare:
  type: choice
  question: "If you only compared isolates that share an ST, which isolate would you leave out?"
  options:
    - "GCA_032856485.1"
    - "GCA_040936765.1"
    - "GCA_058079015.1"
    - "None, they all share an ST"
  answer: 2
  explanation: "GCA_040936765.1 has a different ST from the other two, so an ST-based grouping would set it aside, even though it is only 12 and 18 SNPs from them across the whole genome."

ecoli-st-alleles:
  type: open
  question: "How many of the seven alleles differ between GCA_040936765.1 and the other two isolates? How can isolates that are only 12–18 SNPs apart have different STs?"
  sample_answer: "Only a small number of alleles differ, possibly just one. Each allele number stands for an exact gene sequence, so a single SNP in one of the seven MLST genes creates a new allele and therefore a new ST. ST numbers are labels for allele combinations, not measures of genome-wide distance."

ecoli-floc-together:
  type: choice
  question: "Where did Floc place GCA_040936765.1?"
  options:
    - "In a cluster of its own"
    - "In the same cluster as the other two isolates"
    - "Nowhere, Floc could not cluster it"
  answer: 2
  explanation: "Floc grouped all three isolates together. It compares genomes directly across the whole genome, so isolates this closely related cluster together regardless of their ST."

ecoli-floc-name:
  type: choice
  question: "If another laboratory clustered these same three isolates in its own Floc database, would it give them the same cluster number?"
  options:
    - "Yes, cluster numbers are fixed, like STs"
    - "Not necessarily, numbers depend on each database's history"
    - "Only if the isolates share an ST"
  answer: 2
  explanation: "Floc numbers clusters in the order it finds them within one database. Another laboratory (or a rebuilt database, or a different distance threshold) can find the same group of genomes and give it a different number. That is what makes cluster names harder to communicate than STs."

flu-why-subtype:
  type: open
  question: "Both viruses are influenza A. Why is it more useful to describe them by subtype than by species?"
  sample_answer: "The species \"influenza A\" includes viruses whose genomes are very different: these two share only about 85% identity across the parts that could be compared at all. The subtype, based on the HA and NA surface proteins, tells you far more about the virus: how it interacts with the immune system, which vaccines and antivirals are relevant, and which other viruses it can sensibly be compared with."
