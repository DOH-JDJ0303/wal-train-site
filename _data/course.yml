# =============================================================
#  Course outline
#  Sections appear in this order everywhere on the site (home page,
#  sidebar, course overview, previous/next links).
#
#  Each section needs a folder under sections/ containing:
#    index.md        – the section overview (layout: section)
#    *.md            – lectures (layout: lecture) and activities
#                      (layout: activity) with `section: <id>` and `order: <n>`
# =============================================================
sections:
  - id: population-genomics
    title: Foundations of Microbial Population Genomics
    summary: Microbial evolution, mutation, recombination, population structure, genetic diversity, and species delineation.

  - id: classification-subtyping
    title: Taxonomic Classification and Genomic Subtyping
    summary: Genome-based species identification, MLST, k-mer-based methods, and other microbial typing approaches.

  - id: genomic-relatedness
    title: High-Resolution Genomic Relatedness
    summary: Core genome MLST (cgMLST), core-SNP analysis, genomic distance, clustering, and analytical limitations.

  - id: phylogenetic-methods
    title: Phylogenetic Methods and Tree Building
    summary: Evolutionary models, tree-building methods, rooting, branch lengths, support values, and tree interpretation.

  - id: phylogenomic-evidence
    title: Interpreting Phylogenomic Evidence in Outbreak Investigations
    summary: Genomic clusters, background diversity, epidemiological integration, uncertainty, and transmission inference limitations.

  - id: case-studies
    title: Integrated Genomic Epidemiology Case Studies
    summary: Applying typing, genomic relatedness, phylogenetics, and epidemiological evidence to outbreak investigation scenarios.
