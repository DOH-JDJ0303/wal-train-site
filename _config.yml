# =============================================================
#  Site settings: edit these first
# =============================================================
title: Microbial Population Genomics and Phylogenetics
tagline: Genomic epidemiology for public health outbreak investigations
description: >-
  Lectures and hands-on activities on microbial population genomics,
  genomic typing, genomic relatedness, and phylogenetics for public
  health outbreak investigations.

# Who developed and maintains this training
organization: Western Region AMD Leads

# Link back to the central training hub (leave blank to hide)
hub_url: ""
hub_name: "All training courses"

# For a project site at https://<user>.github.io/<repo>/ set:
#   url:     "https://<user>.github.io"
#   baseurl: "/<repo>"
# The GitHub Actions workflow overrides baseurl automatically on deploy.
url: "https://doh-jdj0303.github.io"
baseurl: "/wal-train-site"

# Optional footer text (remove either line to hide it)
funding: >-
  This work is supported by [Funding Source] under award number
  [Grant/Cooperative Agreement Number].
disclaimer: >-
  Course materials are provided for training purposes only.

# Link shown in the header and footer (leave blank to hide)
repository_url: "https://github.com/DOH-JDJ0303/wal-train-site"

# Logos: full size (home page), small (header and app icon), browser tab icon
logo: /assets/images/logo.png
logo_small: /assets/images/logo-192.png
favicon: /assets/images/favicon-48.png

# =============================================================
#  Navigation
# =============================================================
# Pages listed in the top header, in order
header_pages:
  - pages/course.html
  - pages/resources.md
  - pages/about.md

# =============================================================
#  Build settings
# =============================================================
theme: minima
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  # Everything under sections/ gets the course sidebar
  - scope:
      path: "sections"
    values:
      course_nav: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - AUTHORING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
  - templates
